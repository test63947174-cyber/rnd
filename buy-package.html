<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Buy Package · RND Staking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080e1a; color: #f0f4ff; min-height: 100vh; }
        
        .navbar-custom {
            background: rgba(8,14,26,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(46,204,113,0.15);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1050;
        }
        .navbar-custom .navbar-brand { font-weight: 800; font-size: 1.2rem; color: #fff !important; }
        .navbar-custom .navbar-brand i { color: #2ecc71; }
        
        .sidebar-toggle {
            background: rgba(46,204,113,0.12);
            border: 1px solid rgba(46,204,113,0.2);
            color: #2ecc71;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }
        .sidebar-toggle:hover { background: rgba(46,204,113,0.2); }
        
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1060;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }
        
        .sidebar-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: rgba(12,20,35,0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(46,204,113,0.15);
            z-index: 1070;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 25px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-panel.open { right: 0; }
        
        .sidebar-panel .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(46,204,113,0.1);
            margin-bottom: 15px;
        }
        .sidebar-panel .sidebar-header h5 { color: #fff; font-weight: 700; margin: 0; font-size: 1.1rem; }
        .sidebar-panel .sidebar-header h5 i { color: #2ecc71; }
        .sidebar-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #8899bb;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }
        .sidebar-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
        
        .sidebar-panel .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            color: #8899bb;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 2px 12px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .sidebar-panel .nav-item:hover { background: rgba(46,204,113,0.08); color: #fff; }
        .sidebar-panel .nav-item.active { background: rgba(46,204,113,0.12); color: #2ecc71; }
        .sidebar-panel .nav-item i { font-size: 1.2rem; width: 28px; text-align: center; }
        .sidebar-panel .nav-item .badge {
            margin-left: auto;
            background: rgba(46,204,113,0.15);
            color: #2ecc71;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 20px;
        }
        
        .sidebar-panel .sidebar-footer {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid rgba(46,204,113,0.08);
        }
        .sidebar-panel .sidebar-footer .nav-item { color: #f87171; }
        .sidebar-panel .sidebar-footer .nav-item:hover { background: rgba(239,68,68,0.08); color: #f87171; }
        
        .user-profile-sidebar {
            padding: 10px 20px 20px;
            border-bottom: 1px solid rgba(46,204,113,0.08);
            margin-bottom: 10px;
        }
        .user-profile-sidebar .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71, #1a7a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
        .user-profile-sidebar .user-name { color: #fff; font-weight: 600; font-size: 0.95rem; }
        .user-profile-sidebar .user-id { color: #8899bb; font-size: 0.75rem; }
        
        .dashboard-container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        .card-glass {
            background: rgba(19,34,55,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46,204,113,0.1);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .card-glass:hover { border-color: rgba(46,204,113,0.3); transform: translateY(-3px); }
        .card-glass .card-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 15px; }
        .card-glass .card-title i { color: #2ecc71; margin-right: 8px; }
        
        /* ============================================================
           WALLET CARDS (UPDATED - only 2 cards, better design)
           ============================================================ */
        .wallet-cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 0;
        }
        
        .wallet-card-new {
            position: relative;
            border-radius: 20px;
            padding: 1.6rem 1.4rem;
            background: rgba(19, 34, 55, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(46, 204, 113, 0.15);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }
        .wallet-card-new::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            opacity: 0.14;
            filter: blur(40px);
            pointer-events: none;
        }
        .wallet-card-new.deposit::before { background: #2ecc71; }
        .wallet-card-new.referral::before { background: #fbbf24; }
        
        .wallet-card-new:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.4);
        }
        .wallet-card-new.deposit:hover { border-color: rgba(46, 204, 113, 0.45); }
        .wallet-card-new.referral:hover { border-color: rgba(251, 191, 36, 0.45); }
        
        .wallet-card-new .wallet-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }
        .wallet-card-new .wallet-card-label {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #8899bb;
        }
        .wallet-card-new .wallet-card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .wallet-card-new.deposit .wallet-card-icon {
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid rgba(46, 204, 113, 0.25);
            color: #2ecc71;
        }
        .wallet-card-new.referral .wallet-card-icon {
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.25);
            color: #fbbf24;
        }
        .wallet-card-new .wallet-card-value {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.15;
            position: relative;
            z-index: 1;
        }
        .wallet-card-new.deposit .wallet-card-value { color: #2ecc71; }
        .wallet-card-new.referral .wallet-card-value { color: #fbbf24; }
        .wallet-card-new .wallet-card-currency {
            font-size: 0.8rem;
            font-weight: 500;
            color: #8899bb;
            margin-left: 4px;
        }
        .wallet-card-new .wallet-card-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(46, 204, 113, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #8899bb;
            position: relative;
            z-index: 1;
        }
        .wallet-card-new .wallet-card-footer i {
            font-size: 0.9rem;
        }
        .wallet-card-new.deposit .wallet-card-footer i { color: #2ecc71; }
        .wallet-card-new.referral .wallet-card-footer i { color: #fbbf24; }
        
        .package-card {
            background: rgba(8,14,26,0.6);
            border: 1px solid rgba(46,204,113,0.12);
            border-radius: 20px;
            padding: 1.75rem 1.25rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: default;
            height: 100%;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .package-card:hover { 
            border-color: rgba(46,204,113,0.45); 
            transform: translateY(-6px); 
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
        }
        .package-card.selected {
            border-color: #2ecc71;
            border-width: 2px;
            background: rgba(46,204,113,0.08);
            box-shadow: 0 0 0 1px #2ecc71, 0 12px 32px rgba(46,204,113,0.15);
        }
        .package-card .plan-name { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
        .package-card .price { font-size: 2.2rem; font-weight: 800; color: #2ecc71; line-height: 1.2; }
        .package-card .price span { font-size: 1rem; color: #8899bb; font-weight: 400; }
        .package-card .duration { color: #8899bb; font-size: 0.85rem; margin-top: 4px; }
        .package-card .reward { color: #fbbf24; font-weight: 600; font-size: 1.1rem; margin-top: 8px; }
        .package-card .you-will-receive { color: #60a5fa; font-size: 0.9rem; margin-top: 4px; }
        .package-card .daily-release { color: #34d399; font-size: 0.85rem; }
        .package-card .features { 
            margin-top: 14px; 
            text-align: left; 
            color: #a0b8d0; 
            font-size: 0.85rem;
            width: 100%;
            padding-left: 4px;
        }
        .package-card .features li { 
            list-style: none; 
            margin-bottom: 5px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .package-card .features li i { color: #2ecc71; font-size: 1rem; width: 18px; }
        
        .package-card .plan-cta {
            margin-top: 18px;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            background: linear-gradient(145deg, #f59e0b, #d97706);
            color: #0b111e;
            box-shadow: 0 8px 18px rgba(245, 158, 11, 0.25);
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .package-card .plan-cta:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(245, 158, 11, 0.4);
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            color: #000;
        }
        .package-card .plan-cta i { font-size: 1.1rem; }
        
        .form-control-custom {
            background: rgba(8,14,26,0.8) !important;
            border: 1px solid rgba(46,204,113,0.15) !important;
            color: #f0f4ff !important;
            padding: 12px 16px !important;
            border-radius: 12px !important;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control-custom:focus {
            border-color: #2ecc71 !important;
            box-shadow: 0 0 0 3px rgba(46,204,113,0.15) !important;
        }
        .form-control-custom::placeholder { color: #556688 !important; }
        .form-control-custom:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .form-label { font-weight: 600; color: #a0b8d0; font-size: 0.9rem; margin-bottom: 6px; }
        .form-label .required { color: #ef4444; }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(46,204,113,0.3); color: #fff; }
        .btn-primary-custom:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        
        .package-history { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .package-history::-webkit-scrollbar { width: 4px; }
        .package-history::-webkit-scrollbar-track { background: rgba(46,204,113,0.05); border-radius: 10px; }
        .package-history::-webkit-scrollbar-thumb { background: rgba(46,204,113,0.3); border-radius: 10px; }
        
        .package-item {
            background: rgba(8,14,26,0.4);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(46,204,113,0.06);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .package-item .amount { font-weight: 700; color: #2ecc71; }
        .package-item .total-rnd { font-weight: 600; color: #60a5fa; font-size: 0.85rem; }
        .package-item .status-active { color: #2ecc71; font-size: 0.8rem; }
        .package-item .status-completed { color: #60a5fa; font-size: 0.8rem; }
        .package-item .date { color: #556688; font-size: 0.7rem; }
        .package-item .plan { color: #fbbf24; font-weight: 600; font-size: 0.8rem; }
        .package-item .daily { color: #34d399; font-size: 0.7rem; }
        .package-item .released { color: #fbbf24; font-size: 0.7rem; }
        .package-item .rate-badge { background: rgba(46,204,113,0.1); color: #2ecc71; padding: 2px 10px; border-radius: 12px; font-size: 0.6rem; }
        .package-item .locked { color: #a78bfa; font-size: 0.7rem; }
        .package-item .progress { background: rgba(46,204,113,0.1); border-radius: 4px; height: 4px; width: 120px; }
        .package-item .progress-bar { background: #2ecc71; border-radius: 4px; height: 4px; }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        .toast-custom {
            background: rgba(19,34,55,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 16px;
            padding: 16px 20px;
            color: #f0f4ff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s ease;
            margin-bottom: 10px;
        }
        .toast-custom.success { border-left: 4px solid #2ecc71; }
        .toast-custom.error { border-left: 4px solid #ef4444; }
        .toast-custom i { font-size: 1.5rem; }
        .toast-custom .toast-msg { flex: 1; font-size: 0.9rem; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .rnd-price-badge {
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 30px;
            padding: 4px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2ecc71;
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .release-info-box {
            background: rgba(52,211,153,0.05);
            border: 1px solid rgba(52,211,153,0.1);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }
        .release-info-box .label { color: #8899bb; font-size: 0.7rem; }
        .release-info-box .value { color: #34d399; font-weight: 700; font-size: 0.9rem; }
        
        @media (max-width: 768px) {
            .dashboard-container { padding: 15px; }
            .sidebar-panel { width: 280px; right: -300px; }
            .sidebar-panel .nav-item { padding: 10px 16px; font-size: 0.85rem; }
            .package-card .price { font-size: 1.8rem; }
            .package-card { padding: 1.25rem 1rem; }
            .wallet-cards-row { grid-template-columns: 1fr; gap: 12px; }
            .wallet-card-new .wallet-card-value { font-size: 1.6rem; }
        }
        @media (max-width: 480px) {
            .sidebar-panel { width: 100%; right: -100%; }
            .sidebar-panel.open { right: 0; }
            .card-glass { padding: 1rem; }
            .release-info-box { flex-direction: column; text-align: center; }
            .wallet-card-new { padding: 1.25rem 1.1rem; }
            .wallet-card-new .wallet-card-value { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ====== NAVBAR ====== -->
<nav class="navbar navbar-custom">
    <div class="container-fluid px-3">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <i class="bi bi-currency-bitcoin me-2"></i>RND Staking
        </a>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Menu">
            <i class="bi bi-list"></i>
        </button>
    </div>
</nav>

<!-- ====== SIDEBAR ====== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar-panel" id="sidebarPanel">
    <div class="sidebar-header">
        <h5><i class="bi bi-grid-1x2-fill me-2"></i>Menu</h5>
        <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="user-profile-sidebar">
        <div class="d-flex align-items-center gap-3">
            <div class="avatar" id="sidebarAvatar">U</div>
            <div>
                <div class="user-name" id="sidebarName">User</div>
                <div class="user-id" id="sidebarUserId">ID: ---</div>
            </div>
        </div>
    </div>
    <a href="dashboard.html" class="nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="deposit.html" class="nav-item"><i class="bi bi-arrow-down-circle"></i> Deposit</a>
    <a href="withdrawal.html" class="nav-item"><i class="bi bi-arrow-up-circle"></i> Withdraw</a>
    <a href="referrals.html" class="nav-item"><i class="bi bi-people"></i> Referrals <span class="badge" id="referralBadge">0</span></a>
    <a href="buy-package.html" class="nav-item active"><i class="bi bi-box-seam"></i> Buy Package</a>
    <a href="transactions.html" class="nav-item"><i class="bi bi-receipt"></i> Transactions</a>
    <a href="invoice.html" class="nav-item"><i class="bi bi-file-text"></i> Invoice</a>
    <a href="profile.html" class="nav-item"><i class="bi bi-person"></i> Profile</a>
    <div class="sidebar-footer">
        <a href="#" class="nav-item" id="logoutBtnSidebar"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<!-- ====== MAIN CONTENT ====== -->
<div class="dashboard-container" id="packageContent">
    <div class="text-center py-5">
        <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="text-muted mt-3">Loading packages...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
}
</script>
<script type="module" src="buy-package.js"></script>

</body>
