<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap RND — RND Staking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body {
            background: #0a0e1a;
            color: #e5e7eb;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .swap-container {
            max-width: 520px;
            margin: 40px auto;
        }
        .swap-card {
            background: linear-gradient(145deg, #131824 0%, #0f1420 100%);
            border: 1px solid rgba(46, 204, 113, 0.15);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .swap-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .swap-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #2ecc71, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .swap-header p {
            color: #8b95a5;
            font-size: 0.85rem;
            margin: 0;
        }
        .rnd-balance-box {
            background: rgba(96, 165, 250, 0.08);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rnd-balance-box .label {
            font-size: 0.8rem;
            color: #8b95a5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .rnd-balance-box .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #60a5fa;
        }
        .form-label-custom {
            font-size: 0.8rem;
            color: #8b95a5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }
        .form-control-custom,
        .form-select-custom {
            background: #0a0e1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e5e7eb;
            padding: 14px 16px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }
        .form-control-custom:focus,
        .form-select-custom:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }
        .form-select-custom option {
            background: #131824;
            color: #e5e7eb;
        }
        .rate-preview {
            background: rgba(46, 204, 113, 0.06);
            border: 1px dashed rgba(46, 204, 113, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin: 18px 0;
        }
        .rate-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
        }
        .rate-row.total {
            border-top: 1px solid rgba(46, 204, 113, 0.2);
            padding-top: 12px;
            margin-top: 8px;
            font-weight: 700;
            font-size: 1rem;
        }
        .rate-row .label { color: #8b95a5; }
        .rate-row .value { color: #e5e7eb; }
        .rate-row.total .value { color: #2ecc71; font-size: 1.1rem; }
        .swap-btn {
            width: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            margin-top: 10px;
        }
        .swap-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .swap-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-link {
            display: inline-block;
            color: #8b95a5;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-link:hover { color: #2ecc71; }
        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-custom {
            background: #131824;
            border-left: 4px solid #2ecc71;
            padding: 14px 20px;
            border-radius: 10px;
            color: #e5e7eb;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 260px;
            animation: slideIn 0.3s ease;
        }
        .toast-custom.error { border-left-color: #e74c3c; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading-overlay {
            text-align: center;
            padding: 60px 20px;
            color: #8b95a5;
        }
        .spinner-custom {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(46, 204, 113, 0.2);
            border-top-color: #2ecc71;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="toast-container-custom" id="toastContainer"></div>

<div class="swap-container">
    <a href="dashboard.html" class="back-link">
        <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
    </a>

    <!-- Loading State -->
    <div id="loadingState" class="loading-overlay">
        <div class="spinner-custom"></div>
        <p>Loading your RND wallet...</p>
    </div>

    <!-- Swap Form -->
    <div id="swapFormCard" class="swap-card hidden">
        <div class="swap-header">
            <h2><i class="bi bi-arrow-left-right me-2"></i>Swap RND</h2>
            <p>Convert your RND to USDT instantly</p>
        </div>

        <!-- RND Wallet Display -->
        <div class="rnd-balance-box">
            <div>
                <div class="label">RND Wallet Balance</div>
                <div class="value" id="rndWalletValue">0.0000 RND</div>
            </div>
            <i class="bi bi-database" style="font-size: 2rem; color: #60a5fa; opacity: 0.6;"></i>
        </div>

        <!-- Destination Wallet -->
        <div style="margin-bottom: 18px;">
            <label class="form-label-custom">Swap To</label>
            <select id="toWallet" class="form-select-custom">
                <option value="depositWallet">Deposit Wallet (USDT)</option>
                <option value="referralWallet">Referral Wallet (USDT)</option>
            </select>
        </div>

        <!-- Amount Input -->
        <div style="margin-bottom: 8px;">
            <label class="form-label-custom">Amount to Swap (RND)</label>
            <input type="number" id="swapAmount" class="form-control-custom"
                   placeholder="0.0000" step="0.0001" min="0" autocomplete="off">
        </div>

        <!-- Rate Preview -->
        <div class="rate-preview">
            <div class="rate-row">
                <span class="label">Live RND Rate</span>
                <span class="value" id="liveRate">$0.00</span>
            </div>
            <div class="rate-row total">
                <span class="label">You Will Receive</span>
                <span class="value" id="youReceive">0.00 USDT</span>
            </div>
        </div>

        <!-- Swap Button -->
        <button class="swap-btn" id="swapBtn">
            <i class="bi bi-arrow-left-right me-2"></i>Swap Now
        </button>
    </div>
</div>

<script type="module" src="swap.js"></script>
</body>
</html>
