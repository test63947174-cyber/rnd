<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Login - RND Staking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #080e1a 0%, #0f1f3a 50%, #1a2a4a 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-container { width: 100%; max-width: 440px; }
    .card-glass {
      background: rgba(19,34,55,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(46,204,113,0.15);
      border-radius: 24px;
      padding: 2.5rem;
    }
    .logo-text { font-size: 1.8rem; font-weight: 800; color: #fff; }
    .logo-text span { color: #2ecc71; }
    .form-control-custom {
      background: rgba(8,14,26,0.8) !important;
      border: 1px solid rgba(46,204,113,0.15) !important;
      color: #f0f4ff !important;
      padding: 12px 16px !important;
      border-radius: 12px !important;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .form-control-custom:focus {
      border-color: #2ecc71 !important;
      box-shadow: 0 0 0 3px rgba(46,204,113,0.15) !important;
      background: rgba(8,14,26,0.9) !important;
    }
    .form-control-custom::placeholder { color: #556688 !important; }
    .form-label { font-weight: 600; color: #a0b8d0; font-size: 0.9rem; margin-bottom: 6px; }
    .btn-primary-custom {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none; color: #fff; font-weight: 600;
      padding: 14px; border-radius: 12px; width: 100%;
      transition: all 0.3s ease; font-size: 1rem;
    }
    .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(46,204,113,0.3); color: #fff; }
    .btn-primary-custom:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .btn-google {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #a0b8d0; padding: 12px; border-radius: 12px;
      width: 100%; transition: all 0.3s ease; font-weight: 500;
    }
    .btn-google:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .text-link { color: #2ecc71; text-decoration: none; font-weight: 600; }
    .text-link:hover { text-decoration: underline; }
    .divider { display: flex; align-items: center; color: #556688; font-size: 0.85rem; gap: 15px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(46,204,113,0.15); }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 400px; }
    .toast-custom {
      background: rgba(19,34,55,0.95); backdrop-filter: blur(10px);
      border: 1px solid rgba(46,204,113,0.2);
      border-radius: 16px; padding: 16px 20px; color: #f0f4ff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 12px;
      animation: slideIn 0.4s ease; margin-bottom: 10px;
    }
    .toast-custom.success { border-left: 4px solid #2ecc71; }
    .toast-custom.error { border-left: 4px solid #ef4444; }
    .toast-custom i { font-size: 1.5rem; }
    .toast-custom .toast-msg { flex: 1; font-size: 0.9rem; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .passkey-btn {
      background: rgba(46,204,113,0.1);
      border: 1px solid rgba(46,204,113,0.3);
      color: #2ecc71; padding: 14px; border-radius: 12px;
      width: 100%; font-weight: 600;
      transition: all 0.3s ease; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .passkey-btn:hover { background: rgba(46,204,113,0.2); border-color: #2ecc71; color: #fff; }
    .passkey-btn i { font-size: 1.2rem; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      z-index: 10000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: rgba(19,34,55,0.98);
      border: 1px solid rgba(46,204,113,0.2);
      border-radius: 24px; padding: 2rem; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal-icon { font-size: 3rem; color: #2ecc71; margin-bottom: 1rem; }
    .modal-title { color: #fff; font-weight: 700; font-size: 1.2rem; margin-bottom: 8px; }
    .modal-desc { color: #a0b8d0; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 576px) { .card-glass { padding: 1.5rem; } .logo-text { font-size: 1.5rem; } }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="login-container">
  <div class="card-glass">
    <div class="text-center mb-4">
      <div class="logo-text"><i class="bi bi-currency-bitcoin me-2"></i>RND<span>Staking</span></div>
      <p class="text-muted small">Welcome back! Sign in to your account</p>
    </div>

    <!-- PASSWORD LOGIN FORM -->
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="loginEmail" class="form-control form-control-custom" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary-custom" id="loginBtn">Sign In <i class="bi bi-arrow-right ms-2"></i></button>
    </form>

    <!-- PASSKEY SECTION -->
    <div id="passkeySection" class="mt-3"></div>

    <div class="divider">or continue with</div>

    <button id="googleLoginBtn" class="btn-google">
      <i class="bi bi-google me-2"></i> Sign in with Google
    </button>

    <p class="text-center mt-4 text-muted small">
      Don't have an account? <a href="register.html" class="text-link">Register</a>
    </p>
    <p class="text-center text-muted small">
      <a href="#" id="forgotPasswordLink" class="text-link" style="font-size:0.8rem;">Forgot password?</a>
    </p>
  </div>
</div>

<!-- SETUP PROMPT MODAL -->
<div class="modal-overlay" id="setupPromptModal">
  <div class="modal-box">
    <div class="modal-icon"><i class="bi bi-fingerprint"></i></div>
    <h5 class="modal-title">Set Up Fingerprint / Passkey</h5>
    <p class="modal-desc">Use your device biometrics (fingerprint, Face ID, or screen lock) for faster login next time.</p>
    <div class="modal-actions">
      <button id="setupPasskeyBtn" class="btn-primary-custom" style="padding:10px;">Set Up Now</button>
      <button id="maybeLaterBtn" class="btn-google" style="padding:10px;">Maybe Later</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
  }
}
</script>
<script type="module" src="script.js"></script>
</body>
</html>
