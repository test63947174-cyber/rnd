<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🪔 Diwali Bumper Offer 2026 — Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    background: #05010d;
    font-family: 'Inter', sans-serif;
    padding: 20px;
  }
  .poster {
    position: relative;
    width: 100%; max-width: 560px;
    aspect-ratio: 4 / 5;
    overflow: hidden; border-radius: 24px;
    background:
      radial-gradient(circle at 50% 20%, rgba(147,51,234,0.55), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(234,179,8,0.25), transparent 55%),
      linear-gradient(160deg, #2a0f4d 0%, #160829 45%, #0b0416 100%);
    border: 1px solid rgba(251,191,36,0.35);
    box-shadow: 0 40px 120px -20px rgba(147,51,234,0.6);
    padding: 40px 30px;
    color: #f5f3ff;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
  }
  .poster::before {
    content: ''; position: absolute; inset: -20%;
    background-image:
      radial-gradient(circle, rgba(251,191,36,0.20) 1px, transparent 1px),
      radial-gradient(circle, rgba(251,191,36,0.10) 1px, transparent 1px);
    background-size: 36px 36px, 54px 54px;
    background-position: 0 0, 18px 18px;
    opacity: 0.7;
    animation: spin 90s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sparkle {
    position: absolute; width: 8px; height: 8px;
    background: #fde68a; border-radius: 50%;
    box-shadow: 0 0 14px 4px rgba(253,230,138,0.9);
    animation: twinkle 2.8s infinite;
    pointer-events: none;
  }
  .sp1 { top: 12%; left: 14%; }
  .sp2 { top: 22%; right: 12%; animation-delay: 0.6s; }
  .sp3 { bottom: 30%; left: 10%; animation-delay: 1.2s; }
  .sp4 { bottom: 18%; right: 16%; animation-delay: 1.8s; }
  .sp5 { top: 55%; left: 50%; animation-delay: 0.3s; }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; transform: scale(0.5); }
    50%     { opacity: 1;   transform: scale(1.6); }
  }
  .diya {
    position: absolute; font-size: 44px;
    filter: drop-shadow(0 0 20px rgba(255,180,60,1));
    animation: float 4s ease-in-out infinite;
    pointer-events: none;
  }
  .d1 { top: 6%;  left: 6%;  }
  .d2 { top: 8%;  right: 6%; animation-delay: 0.7s; }
  .d3 { bottom: 8%; left: 8%; animation-delay: 1.4s; font-size: 38px; }
  .d4 { bottom: 6%; right: 8%; animation-delay: 2.1s; font-size: 38px; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%     { transform: translateY(-10px) rotate(5deg); }
  }
  .p-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; width: 100%;
  }
  .tagline {
    font-family: 'Cinzel', serif;
    letter-spacing: 3px; font-size: 0.7rem;
    color: #e9d5ff; margin-bottom: 14px;
    text-transform: uppercase;
  }
  .title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    line-height: 1.05;
    background: linear-gradient(135deg, #fde68a, #fbbf24 45%, #f59e0b 75%, #fde68a);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1.5px;
    text-shadow: 0 6px 30px rgba(251,191,36,0.4);
    margin-bottom: 6px;
  }
  .title span { display: block; }
  .sub {
    color: #e9d5ff; font-weight: 700;
    letter-spacing: 4px; font-size: 0.75rem;
    margin-bottom: 22px;
  }
  .headline-box {
    width: 100%; padding: 16px 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(147,51,234,0.18));
    border: 2px solid rgba(251,191,36,0.55);
    margin-bottom: 22px;
    box-shadow: 0 0 40px rgba(251,191,36,0.25);
  }
  .headline-box .small {
    font-size: 0.72rem; color: #fde68a;
    letter-spacing: 2px; font-weight: 700;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .headline-box .big {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 900; color: #fff;
    text-shadow: 0 0 20px rgba(251,191,36,0.8);
  }
  .rewards {
    width: 100%;
    background: rgba(11,4,22,0.55);
    border: 1px solid rgba(251,191,36,0.25);
    border-radius: 14px; overflow: hidden;
    margin-bottom: 20px;
  }
  .rw-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(251,191,36,0.1);
    font-size: 0.9rem;
  }
  .rw-row:last-child { border-bottom: none; }
  .rw-row .id  { color: #e2e8f0; font-weight: 600; }
  .rw-row .amt { color: #4ade80; font-weight: 800; font-size: 1.05rem; }
  .rw-row.gold .id  { color: #fde68a; font-weight: 800; }
  .rw-row.gold .amt { color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.7); }
  .dates {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem; letter-spacing: 2px;
    color: #fde68a; font-weight: 700;
    margin-bottom: 16px;
  }
  .cta {
    display: inline-block;
    padding: 14px 32px; border-radius: 999px;
    background: linear-gradient(135deg, #fde68a, #fbbf24 50%, #f59e0b);
    color: #1a0b2e;
    font-family: 'Cinzel', serif;
    font-weight: 900; font-size: 0.85rem;
    letter-spacing: 2px;
    box-shadow: 0 10px 40px -8px rgba(251,191,36,0.7);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.04); }
  }
  @media (max-width: 480px) {
    .poster { padding: 28px 18px; border-radius: 18px; }
    .diya { font-size: 34px; }
    .d3, .d4 { font-size: 30px; }
    .rw-row { padding: 8px 14px; font-size: 0.82rem; }
    .rw-row .amt { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div class="poster">
  <div class="sparkle sp1"></div><div class="sparkle sp2"></div>
  <div class="sparkle sp3"></div><div class="sparkle sp4"></div>
  <div class="sparkle sp5"></div>
  <div class="diya d1">🪔</div><div class="diya d2">🪔</div>
  <div class="diya d3">🪔</div><div class="diya d4">🪔</div>
  <div class="p-content">
    <div class="tagline">✦ Celebrate Diwali • Earn Big ✦</div>
    <div class="title">
      <span>DIWALI BUMPER</span>
      <span>OFFER 2026</span>
    </div>
    <div class="sub">🪔 GRAND INDIAN FESTIVAL 🎆</div>
    <div class="headline-box">
      <div class="small">Top Reward</div>
      <div class="big">$1,000 ID → $250</div>
    </div>
    <div class="rewards">
      <div class="rw-row"><span class="id">$50 ID</span><span class="amt">$10</span></div>
      <div class="rw-row"><span class="id">$100 ID</span><span class="amt">$20</span></div>
      <div class="rw-row"><span class="id">$200 ID</span><span class="amt">$45</span></div>
      <div class="rw-row"><span class="id">$500 ID</span><span class="amt">$60</span></div>
      <div class="rw-row gold"><span class="id">$1,000 ID ★</span><span class="amt">$250</span></div>
    </div>
    <div class="dates">2 NOV – 12 NOV 2026</div>
    <div class="cta">JOIN THE CELEBRATION!</div>
  </div>
</div>
</body>
</html>
