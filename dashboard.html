<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard - RND Staking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           MAIN STYLES - COMPLETE DASHBOARD
           ============================================================ */
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080e1a; color: #f0f4ff; min-height: 100vh; }
        
        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        .toast-custom {
            background: rgba(19,34,55,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 16px;
            padding: 16px 20px;
            color: #f0f4ff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.4s ease;
            margin-bottom: 10px;
        }
        .toast-custom.success { border-left: 4px solid #2ecc71; }
        .toast-custom.error { border-left: 4px solid #ef4444; }
        .toast-custom i { font-size: 1.5rem; }
        .toast-custom .toast-msg { flex: 1; font-size: 0.9rem; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Navbar */
        .navbar-custom {
            background: rgba(8,14,26,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(46,204,113,0.15);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1050;
        }
        .navbar-custom .navbar-brand { font-weight: 800; font-size: 1.2rem; color: #fff !important; }
        .navbar-custom .navbar-brand i { color: #2ecc71; }
        .admin-badge {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.65rem;
            color: #f87171;
            font-weight: 600;
        }
        .user-id-badge {
            background: rgba(46,204,113,0.08);
            border: 1px solid rgba(46,204,113,0.08);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #8899bb;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .user-id-badge strong { color: #f0f4ff; }
        .copy-btn-small {
            background: rgba(46,204,113,0.15);
            border: none;
            color: #2ecc71;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.6rem;
            cursor: pointer;
        }
        .copy-btn-small:hover { background: rgba(46,204,113,0.25); }
        
        .rank-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(46,204,113,0.15);
            color: #2ecc71;
            border: 1px solid rgba(46,204,113,0.2);
        }
        .rank-badge.member { background: rgba(46,204,113,0.15); color: #2ecc71; border-color: rgba(46,204,113,0.2); }
        .rank-badge.executive { background: rgba(59,130,246,0.15); color: #60a5fa; border-color: rgba(59,130,246,0.2); }
        .rank-badge.senior-executive { background: rgba(139,92,246,0.15); color: #a78bfa; border-color: rgba(139,92,246,0.2); }
        .rank-badge.manager { background: rgba(251,191,36,0.15); color: #fbbf24; border-color: rgba(251,191,36,0.2); }
        .rank-badge.senior-manager { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.2); }
        .rank-badge.diamond { background: rgba(236,72,153,0.15); color: #f472b6; border-color: rgba(236,72,153,0.2); }
        
        .rnd-price-badge {
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #fbbf24;
        }
        .days-remaining {
            background: rgba(96,165,250,0.08);
            border: 1px solid rgba(96,165,250,0.1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #60a5fa;
        }
        .status-badge.active {
            background: rgba(46,204,113,0.08);
            border: 1px solid rgba(46,204,113,0.1);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #2ecc71;
        }
        
        /* Buttons */
        .btn-primary-custom {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-size: 0.85rem;
            border: 1px solid transparent;
        }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(46,204,113,0.3); color: #fff; }
        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(46,204,113,0.2);
            color: #2ecc71;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-size: 0.85rem;
        }
        .btn-outline-custom:hover { background: rgba(46,204,113,0.05); border-color: #2ecc71; color: #2ecc71; }
        
        /* Welcome Section */
        .welcome-section {
            background: rgba(19,34,55,0.6);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 20px;
            padding: 1.5rem;
        }
        .welcome-section h2 { font-weight: 700; font-size: 1.5rem; }
        .welcome-section h2 span { color: #2ecc71; }
        
        /* Wallet Cards */
        .wallet-card {
            background: rgba(19,34,55,0.6);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .wallet-card:hover { border-color: rgba(46,204,113,0.2); transform: translateY(-3px); }
        .wallet-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 1.1rem;
        }
        .wallet-icon.deposit { background: rgba(46,204,113,0.12); color: #2ecc71; }
        .wallet-icon.referral { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .wallet-icon.rnd { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .wallet-icon.locked { background: rgba(167,139,250,0.12); color: #a78bfa; }
        .wallet-icon.release { background: rgba(52,211,153,0.12); color: #34d399; }
        .wallet-number { font-size: 1.4rem; font-weight: 800; }
        .wallet-number.green { color: #2ecc71; }
        .wallet-number.gold { color: #fbbf24; }
        .wallet-number.blue { color: #60a5fa; }
        .wallet-number.purple { color: #a78bfa; }
        .wallet-number.teal { color: #34d399; }
        .wallet-label { font-size: 0.75rem; color: #8899bb; margin-top: 2px; }
        .wallet-sub { font-size: 0.6rem; color: #556688; margin-top: 1px; }
        
        /* Release Info Box */
        .release-info-box {
            background: rgba(19,34,55,0.4);
            border: 1px solid rgba(46,204,113,0.06);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .release-info-box .label { color: #8899bb; font-size: 0.75rem; margin-right: 4px; }
        .release-info-box .value { color: #f0f4ff; font-weight: 600; font-size: 0.85rem; }
        
        /* Network Stats */
        .network-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
        .network-stat-card {
            background: rgba(19,34,55,0.4);
            border: 1px solid rgba(46,204,113,0.06);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .network-stat-card .number { font-size: 1.3rem; font-weight: 700; color: #2ecc71; }
        .network-stat-card .label { font-size: 0.7rem; color: #8899bb; }
        
        /* Level Stats */
        .level-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; }
        .level-stat-card {
            background: rgba(19,34,55,0.4);
            border: 1px solid rgba(46,204,113,0.06);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .level-stat-card .number { font-size: 1.1rem; font-weight: 700; color: #60a5fa; }
        .level-stat-card .label { font-size: 0.65rem; color: #8899bb; }
        
        /* Card Glass */
        .card-glass {
            background: rgba(19,34,55,0.6);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 16px;
            padding: 1.2rem;
            transition: all 0.3s ease;
        }
        .card-glass:hover { border-color: rgba(46,204,113,0.15); }
        .card-glass .card-title { font-size: 0.95rem; font-weight: 600; color: #f0f4ff; margin-bottom: 12px; }
        .card-glass .card-title i { color: #2ecc71; margin-right: 8px; }
        
        /* Commission Rows */
        .commission-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(46,204,113,0.04);
        }
        .commission-row .level { color: #8899bb; font-size: 0.85rem; }
        .commission-row .earnings { color: #f0f4ff; font-weight: 600; font-size: 0.85rem; }
        
        /* Referral Box */
        .referral-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: rgba(8,14,26,0.6);
            border: 1px solid rgba(46,204,113,0.08);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .referral-box code {
            flex: 1;
            color: #60a5fa;
            font-size: 0.8rem;
            word-break: break-all;
            background: transparent;
            padding: 0;
        }
        .copy-btn {
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.15);
            color: #2ecc71;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .copy-btn:hover { background: rgba(46,204,113,0.2); }
        
        /* Transfer History */
        .transfer-history { max-height: 200px; overflow-y: auto; }
        .transfer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(46,204,113,0.04);
            font-size: 0.8rem;
        }
        .transfer-item .sent { color: #f87171; }
        .transfer-item .received { color: #2ecc71; }
        .transfer-item .user { color: #f0f4ff; font-weight: 500; }
        .transfer-item .amount.sent { color: #f87171; }
        .transfer-item .amount.received { color: #2ecc71; }
        .transfer-item .date { color: #556688; font-size: 0.6rem; }
        
        /* Form Controls */
        .form-control-custom {
            background: rgba(8,14,26,0.8) !important;
            border: 1px solid rgba(46,204,113,0.1) !important;
            color: #f0f4ff !important;
            padding: 10px 14px !important;
            border-radius: 10px !important;
            font-size: 0.85rem;
        }
        .form-control-custom:focus {
            border-color: #2ecc71 !important;
            box-shadow: 0 0 0 3px rgba(46,204,113,0.1) !important;
            background: rgba(8,14,26,0.9) !important;
        }
        .form-control-custom::placeholder { color: #556688 !important; }
        .form-select-custom {
            background: rgba(8,14,26,0.8) !important;
            border: 1px solid rgba(46,204,113,0.1) !important;
            color: #f0f4ff !important;
            padding: 10px 14px !important;
            border-radius: 10px !important;
            font-size: 0.85rem;
            appearance: auto;
        }
        .form-select-custom:focus { border-color: #2ecc71 !important; box-shadow: 0 0 0 3px rgba(46,204,113,0.1) !important; }
        .form-select-custom option { background: #0b1120; color: #f0f4ff; }
        
        /* ============================================================
           RANK PROGRESS CARD - NEW STYLES
           ============================================================ */
        .rank-progress-card {
            background: rgba(19,34,55,0.8);
            border: 1px solid rgba(46,204,113,0.1);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }
        
        .rank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(46,204,113,0.1);
            margin-bottom: 1.5rem;
        }
        
        .rank-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
        }
        .rank-badge.executive { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .rank-badge.senior-executive { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .rank-badge.manager { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .rank-badge.senior-manager { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .rank-badge.diamond { background: linear-gradient(135deg, #ec4899, #db2777); }
        
        .rank-reward {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fbbf24;
        }
        .rank-label {
            display: block;
            font-size: 0.7rem;
            color: #8899bb;
            margin-top: 2px;
        }
        
        .progress-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            padding: 1rem 0;
            overflow-x: auto;
            gap: 4px;
        }
        .progress-steps::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(46,204,113,0.1);
            transform: translateY(-50%);
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 50px;
        }
        .step .step-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(46,204,113,0.1);
            border: 2px solid rgba(46,204,113,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #556688;
            transition: all 0.3s ease;
        }
        .step.completed .step-icon {
            background: #2ecc71;
            border-color: #2ecc71;
            color: #fff;
        }
        .step.active .step-icon {
            background: #2ecc71;
            border-color: #2ecc71;
            color: #fff;
            box-shadow: 0 0 20px rgba(46,204,113,0.3);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(46,204,113,0.3); }
            50% { box-shadow: 0 0 30px rgba(46,204,113,0.5); }
        }
        .step .step-label {
            font-size: 0.55rem;
            color: #8899bb;
            margin-top: 4px;
            text-align: center;
        }
        .step .step-reward {
            font-size: 0.5rem;
            color: #fbbf24;
            font-weight: 600;
        }
        
        .rank-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(46,204,113,0.1);
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            font-size: 0.6rem;
            color: #8899bb;
            margin-bottom: 2px;
        }
        .detail-value {
            font-weight: 600;
            color: #f0f4ff;
            font-size: 0.8rem;
        }
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(46,204,113,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 3px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        /* Sidebar Styles */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1060;
            display: none;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }
        
        .sidebar-panel {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(8,14,26,0.98);
            backdrop-filter: blur(20px);
            z-index: 1070;
            transition: left 0.3s ease;
            padding: 20px;
            border-right: 1px solid rgba(46,204,113,0.1);
            overflow-y: auto;
        }
        .sidebar-panel.open { left: 0; }
        .sidebar-panel .sidebar-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8899bb;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .sidebar-panel .sidebar-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0 auto 10px;
        }
        .sidebar-panel .sidebar-name {
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #f0f4ff;
        }
        .sidebar-panel .sidebar-userid {
            text-align: center;
            font-size: 0.7rem;
            color: #556688;
            margin-bottom: 20px;
        }
        .sidebar-panel .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-panel .sidebar-menu li {
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: all 0.3s ease;
            color: #8899bb;
            cursor: pointer;
        }
        .sidebar-panel .sidebar-menu li:hover {
            background: rgba(46,204,113,0.05);
            color: #f0f4ff;
        }
        .sidebar-panel .sidebar-menu li i { margin-right: 12px; width: 20px; }
        .sidebar-panel .sidebar-menu li.active {
            background: rgba(46,204,113,0.08);
            color: #2ecc71;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 10px;
        }
        .sidebar-toggle:hover { color: #f0f4ff; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .wallet-number { font-size: 1.1rem; }
            .network-stats { grid-template-columns: repeat(2, 1fr); }
            .level-stats { grid-template-columns: repeat(3, 1fr); }
            .rank-details { grid-template-columns: repeat(2, 1fr); }
            .progress-steps { gap: 2px; }
            .step .step-label { font-size: 0.45rem; }
            .step .step-icon { width: 26px; height: 26px; font-size: 0.6rem; }
            .rank-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .release-info-box { flex-direction: column; align-items: flex-start; gap: 6px; }
            .sidebar-panel { width: 280px; left: -300px; }
        }
        @media (max-width: 480px) {
            .wallet-card { padding: 0.8rem; }
            .rank-progress-card { padding: 1rem; }
            .rank-details { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<div class="sidebar-panel" id="sidebarPanel">
    <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
    <div class="sidebar-avatar" id="sidebarAvatar">U</div>
    <div class="sidebar-name" id="sidebarName">User</div>
    <div class="sidebar-userid" id="sidebarUserId">ID: ...</div>
    <ul class="sidebar-menu">
        <li class="active"><i class="bi bi-speedometer2"></i>Dashboard</li>
        <li><i class="bi bi-wallet2"></i>Wallet</li>
        <li><i class="bi bi-box-seam"></i>Packages</li>
        <li><i class="bi bi-people"></i>Referrals</li>
        <li><i class="bi bi-arrow-left-right"></i>Transfer</li>
        <li><i class="bi bi-clock-history"></i>History</li>
        <li style="border-top:1px solid rgba(46,204,113,0.1);margin-top:10px;padding-top:10px;">
            <i class="bi bi-box-arrow-right"></i>Logout
        </li>
    </ul>
</div>

<!-- Navbar -->
<nav class="navbar navbar-custom">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center">
